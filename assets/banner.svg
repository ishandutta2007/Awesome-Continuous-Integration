<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic Glowing Animated Elements (Background Layer) -->
  <g opacity="0.6">
    <!-- Pulse Circles -->
    <circle cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="280" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="140;170;140" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Pipeline Connection Lines (Behind Cards & Text) -->
  <g stroke-dasharray="8 8" stroke-width="2" opacity="0.4">
    <path d="M 100 290 Q 300 320 600 290 T 1100 290" fill="none" stroke="#06b6d4">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 50 70 Q 400 30 700 70 T 1150 60" fill="none" stroke="#ec4899">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Decorative Animated Floating Nodes / Status Pills (Midground) -->
  <g transform="translate(80, 270)" opacity="0.85">
    <rect width="130" height="36" rx="18" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Build: Passed</text>
  </g>

  <g transform="translate(980, 60)" opacity="0.85">
    <rect width="140" height="36" rx="18" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#3b82f6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Deploy: Active</text>
  </g>

  <!-- Main Center Header Content (Foreground Layer - Clear & Unobstructed) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    
    <!-- Top Badge / Pill -->
    <g transform="translate(0, 50)">
      <rect x="-140" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="0" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ CURATED DEVOPS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Continuous Integration
    </text>

    <!-- Gradient Subtitle Accent Line -->
    <rect x="-180" y="152" width="360" height="4" rx="2" fill="url(#accent-cyan)"/>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Top SaaS Platforms &amp; High-Star Open-Source CI/CD Engines
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 230)">
      <!-- Tag 1 -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="70" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🚀 SaaS Platforms</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-75, 0)">
        <rect x="0" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="75" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">⭐ Open-Source CI</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="70" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🛠️ Local-First CI</text>
      </g>
    </g>

    <!-- Bottom Metadata Text -->
    <text x="0" y="305" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="500">
      Updated for 2026 • Verified Pricing, Free Tier Quotas &amp; GitHub Star Analytics
    </text>
  </g>
</svg>
